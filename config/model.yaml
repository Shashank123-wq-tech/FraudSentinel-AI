phase1:

  model_type: xgboost

  objective: binary:logistic

  eval_metric: aucpr

  n_estimators: 2000

  early_stopping_rounds: 30

  tree_method: hist

  device: cpu

  random_state: 42

  n_jobs: -1

  hyperparameters:

    max_depth: 6

    min_child_weight: 1

    learning_rate: 0.07091340754075995

    subsample: 0.8881945843174721

    colsample_bytree: 0.8445573399695375

    gamma: 0.25073469812212335

    reg_alpha: 1.0560705268797807e-06

    reg_lambda: 0.19158576751393638

  class_imbalance:

    method: scale_pos_weight

    calculate_from_training_data: true
